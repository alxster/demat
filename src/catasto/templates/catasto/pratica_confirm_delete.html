{% extends 'catasto/base.html' %}

{% block title %}Elimina Pratica{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1>Elimina Pratica</h1>
    </div>
    <div class="card-body">
        <p class="alert alert-danger">
            Sei sicuro di voler eliminare la pratica "{{ object }}"?
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-danger">Elimina</button>
                <a href="{% url 'catasto:pratica-list' %}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
